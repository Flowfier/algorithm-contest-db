name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet restore web/AlgorithmContestWeb.csproj
      - run: dotnet build web/AlgorithmContestWeb.csproj --configuration Release --no-restore
      - run: node --check web/wwwroot/app.js
